name: Build Windows installer

# Builds only the Windows installer (.exe). Run it manually from the Actions tab:
#   Actions -> "Build Windows installer" -> Run workflow
# When it finishes, download the "windows-x64-installer" artifact from the run page.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install bundled FFmpeg binary
        run: node node_modules/ffmpeg-static/install.js

      - name: Install app dependencies
        run: npx electron-builder install-app-deps

      - name: Build Windows app
        shell: pwsh
        run: |
          npm run build:platform-native-helpers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tsc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx vite build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --win nsis --x64 --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
